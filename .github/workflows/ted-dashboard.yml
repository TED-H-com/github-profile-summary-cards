name: Ted dashboard

# Collects public GitHub numbers once a day, renders the dashboard SVGs and
# publishes them to GitHub Pages. The run uses the workflow's own GITHUB_TOKEN on
# purpose: it sees what any visitor sees, so private work never reaches the cards.
on:
    schedule:
        - cron: '23 9 * * *'
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - 'src/ted/**'
            - '.github/workflows/ted-dashboard.yml'

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'
            - run: npm ci
            - run: npx jest tests/ted --coverage=false
            - run: npm run build
            - name: Collect and render
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  USERNAME: teddashh
                  EXCLUDE_REPOS: ''
                  OUTPUT_DIR: site
              run: node lib/ted/cli.js
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5

    # GitHub pauses scheduled workflows after 60 days without repository activity.
    # Re-enabling the workflow through the API resets that clock without a commit.
    keepalive:
        if: github.event_name == 'schedule'
        runs-on: ubuntu-latest
        permissions:
            actions: write
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ted-dashboard.yml/enable"
